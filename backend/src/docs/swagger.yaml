openapi: 3.0.0

info:
  title: Personal Finance Tracker API
  version: 1.0.0
  description: Finance Tracker Backend API

servers:
  - url: http://localhost:5000

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

tags:
  - name: Auth
  - name: Transactions

paths:

  /auth/register:
    post:
      tags:
        - Auth

      summary: Register user

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              properties:
                name:
                  type: string

                email:
                  type: string

                password:
                  type: string

      responses:
        201:
          description: User registered


  /auth/login:
    post:
      tags:
        - Auth

      summary: Login user

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              properties:
                email:
                  type: string

                password:
                  type: string

      responses:
        200:
          description: Login successful


  /transactions:
    get:
      tags:
        - Transactions

      summary: Get transactions

      security:
        - bearerAuth: []

      responses:
        200:
          description: Transactions list

    post:
      tags:
        - Transactions

      summary: Create transaction

      security:
        - bearerAuth: []

      requestBody:
        required: true

        content:
          application/json:
            schema:
              type: object

              properties:
                title:
                  type: string

                amount:
                  type: number

                type:
                  type: string

                category:
                  type: string

      responses:
        201:
          description: Transaction created


  /transactions/monthly-summary:
    get:
      tags:
        - Transactions

      summary: Monthly summary

      security:
        - bearerAuth: []

      responses:
        200:
          description: Summary data